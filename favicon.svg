<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="disk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#d9531e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the disk's far side, lensed up and over the hole -->
  <circle cx="32" cy="32" r="27" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="url(#disk)" stroke-width="4"/>
  <!-- the disk behind the hole -->
  <ellipse cx="32" cy="33" rx="30" ry="7" fill="none" stroke="url(#disk)" stroke-width="4"/>
  <!-- shadow and photon ring -->
  <circle cx="32" cy="32" r="15" fill="#000"/>
  <circle cx="32" cy="32" r="15.6" fill="none" stroke="#ffe7b8" stroke-width="1.2"/>
  <!-- the disk's near side, crossing in front -->
  <path d="M2 33 A30 7 0 0 0 62 33" fill="none" stroke="url(#disk)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
